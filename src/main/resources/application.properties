# ================================================================
#  POS CLUB DE JAZZ - Configuración de desarrollo
# ================================================================

# ----------------------------------------------------------------
# SERVIDOR
# El servidor escucha en el puerto 8080.
# Todos los celulares de la red acceden como http://192.168.x.x:8080
# ----------------------------------------------------------------
server.port=8080

# ----------------------------------------------------------------
# BASE DE DATOS H2 EN MODO ARCHIVO
#
# './data/jazz_pos' significa: guarda el archivo de BD en la carpeta
# 'data' junto al JAR. Persiste aunque reinicias la app.
#
# AUTO_SERVER=TRUE permite que múltiples conexiones accedan al
# mismo archivo (importante cuando H2 Console está abierta).
# ----------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/jazz_pos;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=jazz
spring.datasource.password=jazz2024

# ----------------------------------------------------------------
# CONSOLA WEB DE H2
# Accede a http://localhost:8080/h2-console mientras desarrollas.
# Te muestra todas las tablas y puedes ejecutar SQL directamente.
# MUY útil para verificar que tus datos se guardan correctamente.
#
# IMPORTANTE: deshabilitar en producción real (aquí no aplica).
# ----------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------------
# JPA / HIBERNATE
#
# ddl-auto=validate: Hibernate verifica que tus @Entity coincidan
# con las tablas, pero NO las crea ni modifica. Flyway se encarga
# de crear las tablas con tu schema.sql. Esta separación es clave:
# Flyway = estructura de BD / Hibernate = mapeo de objetos.
#
# show-sql=true: imprime en consola cada query SQL que ejecuta
# Hibernate. Esencial para aprender qué hace JPA por dentro.
# Cuando veas un query raro, aquí lo encontrarás.
# ----------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------
# FLYWAY - MIGRACIONES
#
# Flyway busca archivos en classpath:db/migration/
# Los ejecuta en orden: V1__, V2__, V3__...
# Registra qué ya ejecutó en la tabla 'flyway_schema_history'.
# Si el archivo ya se ejecutó antes, lo salta.
# ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ----------------------------------------------------------------
# LOGGING
# INFO muestra arranque y errores. Cambia a DEBUG si necesitas
# ver el detalle completo de Hibernate.
# ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.jazzclub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
